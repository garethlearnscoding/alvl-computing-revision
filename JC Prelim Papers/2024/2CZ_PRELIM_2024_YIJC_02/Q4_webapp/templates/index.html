<html>
  <head>
    <title>Concerts</title>
  </head>

  <body>
    <h1>List of Concerts</h1>
    <table border="1">
      <tr>
        <th>Concert Name</th>
        <th>Artiste</th>
        <th>Date</th>
        <th>Price</th>
        <th>Quantity of Tickets</th>
      </tr>
      {% for i in data %}
      <tr>
        {% for j in i %}
        <td>{{j}}</td>
        {% endfor %}
      </tr>
      {% endfor %}
    </table>
    <a href="/booking">Booking Page</a>
  </body>
</html>
